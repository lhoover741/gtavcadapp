<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Police CAD Access Required | GTAVCAD</title>
  <link rel="stylesheet" href="/assets/css/style.css" />
</head>
<body data-community-page="true">
  <main>
    <section class="container section">
      <div class="card notice-card">
        <h1>Police CAD access required</h1>
        <p>Signed in as <strong data-context-username>authenticated user</strong>. Your current community role does not have permission to access Police CAD.</p>
        <p>Role: <span data-context-role>Loading…</span></p>
        <div class="hero-actions">
          <a class="button button-primary" data-community-link="index" href="#">Return to Community Home</a>
          <button type="button" class="button button-secondary" data-auth-logout>Logout</button>
        </div>
      </div>
    </section>
  </main>
  <script src="/assets/js/main.js"></script>
</body>
</html>
